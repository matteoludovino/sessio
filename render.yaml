# Render Blueprint (free plan). Create it from the dashboard: New > Blueprint > this repo.
# PostgreSQL is external (Neon free plan): fill DATABASE_URL with its connection string.
services:
  - type: web
    name: sessio-api
    runtime: docker
    plan: free            # sleeps after 15 min without traffic; the scheduler wakes it up hourly
    region: virginia      # same region as the Neon database (aws-us-east-1)
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: "10000"
      - key: NODE_ENV
        value: production   # refuses to boot with development secrets
      - key: DATABASE_URL
        sync: false         # Neon connection string, with ?sslmode=require
      - key: WEB_ORIGIN
        sync: false         # the Vercel URL, e.g. https://sessio-demo.vercel.app (CSRF + e-mail links)
      - key: DEMO_MODE
        value: "true"       # public demo: seeds itself, e-mails go to the in-app outbox only
      - key: MAIL_TRANSPORT
        value: log          # nothing leaves the server; switch to resend + RESEND_API_KEY for real mail
      - key: MAIL_FROM
        value: Sessio <no-reply@sessio.local>
      - key: JOBS_SECRET
        sync: false         # also stored as a GitHub Actions secret, for the scheduler
      - key: LINK_SECRET
        generateValue: true # random 256-bit value generated by Render
      - key: NOTES_ENCRYPTION_KEYS
        sync: false         # "1:<base64 of 32 random bytes>"; losing it makes the notes unreadable
      - key: JOBS_INTERVAL_MINUTES
        value: "5"
      - key: OUTBOX_RELAY
        value: "on"
